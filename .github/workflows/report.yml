name: report

# Clamp Index reporter 2: started every 15 minutes, five minutes after
# reporter 1, by a Supabase pg_cron job through the GitHub API
# (workflow_dispatch). GitHub's own schedule trigger did not start this
# workflow reliably, so it is not used (no double runs).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Report prices to the Clamp Index (devnet)
        env:
          REPORTER_KEYPAIR: ${{ secrets.REPORTER_KEYPAIR }}
        run: node --no-deprecation reporter.mjs
